  <g transform="translate(275 212)" style="color:#f2f5f7"><use href="#swords"/><use href="#arc"/></g>
  <g transform="translate(540 212)" style="color:#f7d34b"><use href="#swords"/><use href="#arc"/></g>
  <g transform="translate(805 212)" style="color:#f65b52">
