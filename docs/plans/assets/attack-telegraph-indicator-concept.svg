<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="공격 전조 방향 인디케이터 시안: 검 적 쌍검과 늑대 이빨의 흰색, 노란색, 붉은색 상태">
  <rect width="1000" height="490" rx="24" fill="#111820"/>
  <text x="44" y="47" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="25" font-weight="700">ATTACK TELEGRAPH · ICON CONCEPT</text>
  <text x="44" y="75" fill="#91a0ad" font-family="Arial, sans-serif" font-size="14">화면 밖 공격자 방향 마커 · 원호는 기존 배치 재사용</text>
